[customizations.installer.kickstart]
contents = """
%post
install -m 0755 /usr/bin/bazzite-custom-firststart /etc/bazzite-custom-firststart

cat >/etc/systemd/system/bazzite-custom-firststart.service <<'EOF'
[Unit]
Description=Bazzite custom first-start setup
Documentation=https://docs.bazzite.gg/Advanced/creating_custom_image/
Wants=network-online.target
After=network-online.target systemd-user-sessions.service

[Service]
Type=oneshot
ExecStart=/etc/bazzite-custom-firststart
EOF

cat >/etc/systemd/system/bazzite-custom-firststart.timer <<'EOF'
[Unit]
Description=Retry Bazzite custom first-start setup until complete

[Timer]
OnBootSec=2min
OnUnitActiveSec=10min
AccuracySec=1min
Persistent=true
Unit=bazzite-custom-firststart.service

[Install]
WantedBy=timers.target
EOF

chmod 0644 /etc/systemd/system/bazzite-custom-firststart.service
chmod 0644 /etc/systemd/system/bazzite-custom-firststart.timer
mkdir -p /etc/systemd/system/timers.target.wants
ln -sf ../bazzite-custom-firststart.timer /etc/systemd/system/timers.target.wants/bazzite-custom-firststart.timer

bootc switch --mutate-in-place --transport registry ghcr.io/ublue-os/bazzite-deck-nvidia:stable
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]

disable = [
  "org.fedoraproject.Anaconda.Modules.Subscription",
]
